<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control Banc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Control Banc</title>
<style>
  /* Quicksand (SIL OFL), la misma tipografía de Cuadern Docent, alojada aquí para funcionar sin conexión */
  @font-face { font-family:'Quicksand'; font-style:normal; font-weight:300 700; font-display:block;
    src:url(fonts/quicksand-latin-ext-9d611e.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'Quicksand'; font-style:normal; font-weight:300 700; font-display:block;
    src:url(fonts/quicksand-latin-d8da43.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  :root {
    --bg:#eef3f9; --bg2:#f8fbff; --panel:rgba(255,255,255,.94); --panel-fort:#e7eef8; --vora:#d3deec;
    --text:#172334; --suau:#607086; --primari:#2f6fed; --primari-fosc:#245ad0; --blau-titol:#2a5298; --blau-suau:#6e9be0;
    --perill:#b42318; --perill-fons:#fff1f1;
    --radi:16px; --buit:10px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; color:var(--text); font-family:'Quicksand', system-ui, sans-serif; font-weight:500;
    background:linear-gradient(180deg, var(--bg), var(--bg2)); }
  button { font:inherit; color:inherit; }
  body { overflow:hidden; }

  /* La pantalla ocupa exactamente el alto del móvil: nada de desplazarse */
  #app { height:100vh; height:100dvh; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:var(--buit);
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }

  .barra { display:flex; gap:8px; align-items:stretch; flex:none; }
  .mes { border:0; flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
    background:var(--panel); border-radius:var(--radi); padding:8px 8px 8px 16px; text-align:left; }
  .mes:active { background:var(--panel-fort); }
  .mes .nom { font-weight:700; font-size:clamp(17px, 5.4vw, 22px); letter-spacing:.3px; color:var(--blau-titol); line-height:1.1; }
  .mes small { display:block; font-weight:500; color:var(--suau); font-size:11.5px; margin-top:1px; }
  .mes .fletxa { flex:none; width:38px; height:38px; border-radius:12px; background:#d3e4fb; display:grid; place-items:center; }
  .mes .fletxa svg { width:22px; height:22px; fill:var(--blau-suau); }
  .mes:active .fletxa { background:#c2d8f8; }
  .icona-cap { border:0; flex:none; width:48px; border-radius:var(--radi); background:var(--panel); display:grid; place-items:center; cursor:pointer; }
  .icona-cap:active { background:var(--panel-fort); }
  .icona-cap svg { width:22px; height:22px; fill:var(--blau-suau); }

  /* Cuadrícula: 4 reservas en 2×2 y el préstamo debajo; reparten todo el alto disponible */
  main { flex:1; min-height:0; display:grid; gap:var(--buit); grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1.28fr; }
  .targeta { container-type:size; min-height:0; border-radius:var(--radi); padding:10px 12px 10px;
    display:flex; flex-direction:column; justify-content:space-between; gap:4px; }
  .targeta.ample { grid-column:1 / -1; }
  .targeta { position:relative; }
  /* Ilustración pastel arriba a la derecha de cada reserva; su tamaño sigue al de la tarjeta */
  .dibuix { position:absolute; top:clamp(8px, 4.5cqw, 14px); right:clamp(10px, 5.5cqw, 16px); width:clamp(22px, 19cqw, 40px); aspect-ratio:1; pointer-events:none; }
  .dibuix svg { display:block; width:100%; height:100%; }
  .titol { white-space:nowrap; }
  .titol { font-weight:700; font-size:clamp(12px, 8.5cqw, 15px); letter-spacing:.8px; text-transform:uppercase; }
  .saldo { text-align:center; font-weight:700; line-height:1; color:var(--text); font-variant-numeric:tabular-nums;
    font-size:clamp(16px, 13.5cqw, 30px); }
  .targeta.ample .saldo { font-size:clamp(22px, 9cqw, 38px); }
  .saldo.neg { color:var(--perill); }
  .fila { display:flex; align-items:center; justify-content:space-between; gap:6px; min-width:0; }
  /* Si el importe mensual es muy largo, se acorta con «…»; los botones nunca se salen de la tarjeta */
  .xip { font-weight:600; color:var(--suau); background:rgba(255,255,255,.7);
    border-radius:999px; padding:4px 10px; font-size:clamp(12px, 8cqw, 15px); white-space:nowrap;
    min-width:0; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; }
  .accions { display:flex; gap:6px; flex:none; }
  .accio { border:0; width:clamp(32px, 21cqw, 40px); height:clamp(32px, 21cqw, 40px); border-radius:50%; background:#fff; color:var(--blau-suau);
    display:grid; place-items:center; cursor:pointer; padding:0; transition:transform .08s, background .12s; }
  .accio:active { transform:scale(.92); background:#f0f5fd; }
  .accio svg { width:58%; height:58%; fill:currentColor; }
  .barra-pr { height:10px; border-radius:6px; background:rgba(255,255,255,.75); overflow:hidden; }
  .barra-pr > i { display:block; height:100%; border-radius:6px; background:#8fb2ea; transition:width .4s; }
  .pr-info { display:flex; justify-content:space-between; font-size:clamp(11px, 3.4cqw, 13px); color:var(--suau); font-weight:600; }
  .pr-info b { color:var(--blau-titol); }

  /* Colores pastel, como las actividades de la agenda de Cuadern Docent */
  .c-casa { background:#fdf3c9; }  .c-casa .titol { color:#7a6410; }
  .c-cotxe { background:#fde5cf; } .c-cotxe .titol { color:#9a5318; }
  .c-vacances { background:#ece4fb; } .c-vacances .titol { color:#6a45a8; }
  .c-estalvis { background:#dcf5e9; } .c-estalvis .titol { color:#16774f; }
  .c-prestec { background:#e3f0fc; } .c-prestec .titol { color:#2a5298; }

  /* Cuadro de entrada y menú */
  .fons { position:fixed; inset:0; background:rgba(23,35,52,.42); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .fons.on { display:flex; }
  .full { background:#fff; width:100%; max-width:460px; border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:puja .16s ease-out; }
  @media (min-width:600px) { .fons { align-items:center; } .full { border-radius:20px; } }
  @keyframes puja { from { transform:translateY(30px); opacity:.5; } to { transform:none; opacity:1; } }
  .full h3 { margin:0 0 12px; font-size:18px; color:var(--blau-titol); font-weight:700; }
  .full input[type=text] { width:100%; font:inherit; font-weight:700; font-size:26px; padding:10px 14px; border:0; border-radius:12px; background:#f3f7fc;
    text-align:right; color:var(--text); }
  .full input[type=text]:focus { outline:2px solid var(--blau-suau); background:#fff; }
  .error { color:var(--perill); min-height:20px; font-size:14px; margin:6px 0 0; font-weight:600; }
  .files { display:flex; gap:10px; margin-top:12px; }
  .files button, .llista button { flex:1; padding:13px; border-radius:12px; border:0; background:#f0f5fd; color:var(--blau-titol); font-weight:700; font-size:16px; cursor:pointer; }
  .files button { color:var(--suau); }
  .files button.ok { background:#cfe0fb; color:var(--blau-titol); }
  .files button.ok:active { background:#bcd3f7; }
  .llista { display:grid; gap:8px; }
  .llista button { text-align:left; display:flex; align-items:center; gap:12px; background:#f6f9fd; color:var(--text); padding:9px 12px; }
  .llista button:active { background:#eaf1fb; }
  .llista .ic { flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; }
  .llista .ic svg { width:20px; height:20px; fill:currentColor; }
  .ic-blau { background:#dbe8fb; color:#6e9be0; } .ic-verd { background:#dcf5e9; color:#5fb28b; }
  .ic-lila { background:#ece4fb; color:#9a80cf; } .ic-rosa { background:#fde4e4; color:#d9807a; }
  .llista button.perill { color:#b9544d; background:#fff4f3; }
  .nota { color:var(--suau); font-size:13px; margin:10px 2px 0; line-height:1.4; font-weight:500; }
  #avis { position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:30; display:none; justify-content:center; }
  #avis.on { display:flex; }
  #avis div { background:var(--text); color:#fff; border-radius:14px; padding:11px 14px; display:flex; align-items:center; gap:14px; max-width:520px; width:100%; font-weight:600; }
  #avis div.error { background:var(--perill); }
  #avis span { flex:1; font-size:14.5px; }
  #avis button { background:none; border:0; color:#9cc0ff; font-weight:700; font-size:15px; padding:6px 8px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <div class="barra">
    <button class="mes" id="btnMes" aria-label="Passar al mes següent">
      <span><span class="nom" id="titolMes">—</span><small>Toca per passar al mes següent</small></span>
      <span class="fletxa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg></span>
    </button>
    <button class="icona-cap" id="btnDesfer" aria-label="Desfer l'última operació" title="Desfer">
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62A7.97 7.97 0 0 1 12.5 10c3.5 0 6.5 2.3 7.6 5.5l2.4-.8C21 10.6 17.1 8 12.5 8z"/></svg>
    </button>
    <button class="icona-cap" id="btnMenu" aria-label="Menú" title="Menú">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </div>
  <main id="panell"></main>
</div>

<div class="fons" id="fonsEntrada"><div class="full" role="dialog" aria-modal="true">
  <h3 id="entradaTitol"></h3>
  <input id="entradaInput" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Import">
  <div class="error" id="entradaError"></div>
  <div class="files"><button id="entradaCancel">Cancel·lar</button><button id="entradaOk" class="ok">D'acord</button></div>
</div></div>

<div class="fons" id="fonsMenu"><div class="full" role="dialog" aria-modal="true">
  <h3>Menú</h3>
  <div class="llista">
    <button id="mnExportar"><span class="ic ic-blau"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></span><span>Fer còpia de seguretat</span></button>
    <button id="mnImportar"><span class="ic ic-verd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg></span><span>Restaurar una còpia</span></button>
    <button id="mnPrestec"><span class="ic ic-lila"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></span><span>Canviar l'import total del préstec</span></button>
    <button id="mnEsborrar" class="perill"><span class="ic ic-rosa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></span><span>Esborrar totes les dades</span></button>
  </div>
  <p class="nota">Les dades es guarden només en aquest telèfon. Fes còpies de seguretat de tant en tant. Toca fora del quadre per tancar.</p>
  <input type="file" id="fitxer" accept="application/json,.json" hidden>
</div></div>

<div id="avis"><div><span id="avisText"></span><button id="avisDesfer">Desfer</button></div></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
