<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#156082">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control Banc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Control Banc</title>
<style>
  :root { --fons:#F4F7FA; --text:#0E2841; --suau:#5a6b7d; --blau:#156082; --vora:#dbe3ec; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--fons); color:var(--text);
    font-family:"Aptos Narrow","Aptos","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; }
  body { padding-bottom:calc(32px + env(safe-area-inset-bottom)); }
  button { font:inherit; color:inherit; }

  header { position:sticky; top:0; z-index:5; background:var(--blau); color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.25); }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; flex:1; font-weight:700; }
  header .any { opacity:.8; font-weight:400; }
  .icona-cap { width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff;
    display:grid; place-items:center; cursor:pointer; }
  .icona-cap:active { background:rgba(255,255,255,.3); }
  .mes { margin:14px; background:#747474; color:#fff; border:0; border-radius:14px; padding:14px 16px; width:calc(100% - 28px);
    display:flex; align-items:center; justify-content:space-between; font-size:19px; font-weight:700; cursor:pointer;
    box-shadow:2px 3px 6px rgba(0,0,0,.28); }
  .mes small { font-weight:400; opacity:.85; font-size:14px; display:block; }
  .mes:active { filter:brightness(.9); }

  main { display:grid; gap:14px; padding:0 14px; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); max-width:1100px; margin:0 auto; }
  h2.seccio { grid-column:1/-1; margin:8px 0 -4px; font-size:13px; text-transform:uppercase; letter-spacing:1.2px; color:var(--suau); }
  .targeta { background:#fff; border-radius:14px; overflow:hidden; box-shadow:2px 3px 8px rgba(14,40,65,.18); }
  .targeta .titol { padding:9px 14px; font-weight:700; font-size:16px; color:#fff; letter-spacing:.3px; }
  .targeta .cos { padding:10px 14px 14px; }
  .saldo { font-size:34px; font-weight:600; text-align:center; padding:6px 0 10px; color:#595959; font-variant-numeric:tabular-nums; }
  .saldo.neg { color:#c0392b; }
  .accions { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
  .accio { width:52px; height:52px; border-radius:50%; border:2px solid; background:#fff; display:grid; place-items:center; cursor:pointer;
    box-shadow:1px 2px 4px rgba(0,0,0,.2); transition:transform .08s; }
  .accio:active { transform:scale(.92); }
  .accio svg { width:28px; height:28px; fill:currentColor; }
  .accio.mes-mes { color:#2e8b3d; border-color:#2e8b3d; background:#e7f6e9; }
  .accio.menys { color:#c0392b; border-color:#c0392b; background:#fdeaea; }
  .accio.refresca { color:#2f6fb5; border-color:#2f6fb5; background:#e5effa; }
  .accio.monedes { color:#d98b2b; border-color:#d98b2b; background:#fdf1de; }
  .mensual { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; }
  .xip { background:#F7F7F7; border:1px solid #e3e3e3; border-radius:10px; padding:7px 14px; font-style:italic; color:#595959; font-size:16px;
    box-shadow:1px 2px 3px rgba(0,0,0,.12); }
  .accio.info { width:40px; height:40px; color:#2f6fb5; border-color:#2f6fb5; background:#e5effa; }
  .accio.info svg { width:22px; height:22px; }
  .barra { height:12px; border-radius:6px; background:#e3e8ee; overflow:hidden; margin:2px 0 6px; }
  .barra > i { display:block; height:100%; background:linear-gradient(90deg,#4E95D9,#156082); border-radius:6px; transition:width .4s; }
  .pct { text-align:center; font-weight:700; color:#156082; }
  .pagat { text-align:center; color:var(--suau); font-size:14px; margin-bottom:6px; }
  details { grid-column:1/-1; }
  details summary { cursor:pointer; color:var(--suau); text-transform:uppercase; letter-spacing:1.2px; font-size:13px; padding:8px 0; }
  details .dins { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); padding-top:6px; }

  /* Cuadro de entrada y menú */
  .fons { position:fixed; inset:0; background:rgba(14,30,48,.5); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .fons.on { display:flex; }
  .full { background:#fff; width:100%; max-width:460px; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.3); animation:puja .18s ease-out; }
  @media (min-width:600px) { .fons { align-items:center; } .full { border-radius:18px; } }
  @keyframes puja { from { transform:translateY(40px); opacity:.5; } to { transform:none; opacity:1; } }
  .full h3 { margin:0 0 12px; font-size:18px; color:var(--blau); }
  .full input[type=text] { width:100%; font-size:26px; padding:12px; border:2px solid #9aa7b5; border-radius:10px; text-align:right; }
  .full input[type=text]:focus { outline:none; border-color:#4E95D9; }
  .error { color:#c0392b; min-height:20px; font-size:14px; margin:6px 0 0; }
  .fila { display:flex; gap:10px; margin-top:12px; }
  .fila button, .llista button { flex:1; padding:14px; border-radius:12px; border:1px solid #9aa7b5; background:#f3f5f8; font-size:17px; cursor:pointer; }
  .fila button.ok { background:var(--blau); color:#fff; border-color:var(--blau); font-weight:700; }
  .llista { display:grid; gap:8px; }
  .llista button { text-align:left; display:flex; align-items:center; gap:12px; }
  .llista button.perill { color:#c0392b; }
  .llista button:disabled { opacity:.45; }
  .nota { color:var(--suau); font-size:13px; margin:10px 2px 0; line-height:1.4; }
  #avis { position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:30; display:none; justify-content:center; }
  #avis.on { display:flex; }
  #avis div { background:#0E2841; color:#fff; border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:14px; max-width:520px; width:100%;
    box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #avis div.error { background:#c0392b; }
  #avis span { flex:1; }
  #avis button { background:none; border:0; color:#7fc4ff; font-weight:700; font-size:16px; padding:6px 8px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>CONTROL BANC</h1>
  <button class="icona-cap" id="btnDesfer" aria-label="Desfer l'última operació" title="Desfer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62A7.97 7.97 0 0 1 12.5 10c3.5 0 6.5 2.3 7.6 5.5l2.4-.8C21 10.6 17.1 8 12.5 8z"/></svg>
  </button>
  <button class="icona-cap" id="btnMenu" aria-label="Menú" title="Menú">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
</header>

<button class="mes" id="btnMes" aria-label="Passar al mes següent">
  <span><span id="titolMes">—</span><small>Prem per passar al mes següent</small></span>
  <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>
</button>

<main id="panell"></main>

<div class="fons" id="fonsEntrada"><div class="full" role="dialog" aria-modal="true">
  <h3 id="entradaTitol"></h3>
  <input id="entradaInput" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Import">
  <div class="error" id="entradaError"></div>
  <div class="fila"><button id="entradaCancel">Cancel·lar</button><button id="entradaOk" class="ok">D'acord</button></div>
</div></div>

<div class="fons" id="fonsMenu"><div class="full" role="dialog" aria-modal="true">
  <h3>Menú</h3>
  <div class="llista">
    <button id="mnExportar">⬇ Fer còpia de seguretat</button>
    <button id="mnImportar">⬆ Restaurar una còpia</button>
    <button id="mnPrestec">⚙ Canviar l'import total del préstec</button>
    <button id="mnEsborrar" class="perill">🗑 Esborrar totes les dades</button>
    <button id="mnTancar">Tancar</button>
  </div>
  <p class="nota">Les dades es guarden només en aquest telèfon. Fes còpies de seguretat de tant en tant.</p>
  <input type="file" id="fitxer" accept="application/json,.json" hidden>
</div></div>

<div id="avis"><div><span id="avisText"></span><button id="avisDesfer">Desfer</button></div></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
